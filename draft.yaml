models:
  Categories:
    name: string
    relationships:
      hasMany: Product
  
  Product:
    name: string
    category_id: foreignId:categories
    slug: string unique
    description: longtext nullable
    base_price: decimal:12,2
    base_image: string nullable
    rating: decimal:3,2 default:0
    likes: integer default:0
    stock: integer default:0
    relationships:
      hasMany: ProductVariant

  ProductVariant:
    product_id: foreignId:product
    sku: string unique
    price: decimal:12,2 nullable
    stock: integer default:0
    image: string nullable
    relationships:
      hasMany: VariantValue

  VariantOption:
    name: string
    relationships:
      hasMany: VariantValue

  VariantValue:
    product_variant_id: id foreign
    variant_option_id: id foreign
    value: string

  Order:
    user_id: foreignId:user
    total: integer
    status: enum:pending,paid,shipped,delivered,canceled default:pending
    payment_status: enum:unpaid,paid
    shipping_status: enum:pending,shipped,delivered,canceled default:pending
    relationships:
      hasMany: OrderItem
      belongsTo: user, shipping, payment

  OrderItem:
    order_id: foreignId:order
    product_id: foreignId:product
    quantity: integer
    price: integer
    variant_model: string default:standard
    variant_color: string default:standard
    variant_size: string default:standard
    relationships:
      belongsTo: order, product

  Payment:
    order_id: foreignId:order
    payment_type: string
    payment_code: string
    payment_status: enum:pending,paid,failed default:pending
    timestamps: true
    relationships:
      hasMany: order

  Shipping:
    order_id: foreignId:order
    courier: string
    service: string
    cost: integer
    tracking_number: string
    timestamps: true
    relationships:
      hasMany: order



seeders: Categories, product, user, order, order_item, product_variant, variant_option, variant_value
